name: mobprog_delacruz
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
# important!
  flutter_screenutil: ^5.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Klavika
      fonts:
        - asset: assets/fonts/Klavika-Regular.ttf

    - family: Frutiger
      fonts:
        - asset: assets/fonts/FrutigerLTStd-Roman.ttf
  uses-material-design: true
